<div v-else class="members-panel">
              <table class="members-table">
                <thead>
                  <tr>
                    <th>好友</th>
                    <th>联系方式</th>
                    <th>身份标识</th>
                    <th>资料</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="person in filteredFriends" :key="person.ID">
                    <td>
                      <div class="member-cell">
                        <span class="avatar">{{ initials(person.Name) }}</span>
                        <div>
                          <strong>{{ person.Name || '未命名用户' }}</strong
                          ><span>ID · {{ person.ID }}</span>
                        </div>
                      </div>
                    </td>
                    <td>
                      {{ person.Phone || '未填写' }}<br /><span
                        style="color: #9aa9a0"
                        >{{ person.Email || '未填写邮箱' }}</span
                      >
                    </td>
                    <td>{{ person.Identity || '未设置' }}</td>
                    <td>
                      <button
                        class="ghost-button"
                        type="button"
                        @click="viewFriendInfo(person)"
                      >
                        查看资料
                      </button>
                    </td>
                  </tr>
                  <tr v-if="!filteredFriends.length">
                    <td colspan="4" class="table-empty">暂无好友数据</td>
                  </tr>
                </tbody>
              </table>
            </div>
