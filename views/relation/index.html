<div v-if="currentView === 'contacts' && contactSection === 'requests'">
  <div v-if="relationLoading" class="empty-mobile">
    <div><strong>正在加载申请</strong></div>
  </div>
  <div v-else-if="relationRequests.length" class="mobile-list">
    <article
      v-for="item in relationRequests"
      :key="requestId(item)"
      class="request-mobile-item"
    >
      <span class="mobile-avatar warm">{{ initials(requestPersonName(item)) }}</span>
      <div class="request-mobile-copy">
        <strong>{{ requestTitle(item) }}</strong>
        <span>{{ requestDescription(item) }}</span>
        <small>{{ requestStatusText(item) }}</small>
      </div>
      <div v-if="requestCanAct(item)" class="request-mobile-actions">
        <button
          class="compact-button primary"
          type="button"
          :disabled="relationAction === requestId(item)"
          @click="toggleRequest(item, 2)"
        >
          接受
        </button>
        <button
          class="compact-button danger"
          type="button"
          :disabled="relationAction === requestId(item)"
          @click="toggleRequest(item, 3)"
        >
          拒绝
        </button>
      </div>
    </article>
  </div>
  <div v-else class="empty-mobile">
    <div>
      <span class="empty-mobile-icon"><i data-lucide="inbox"></i></span>
      <strong>暂无申请</strong>
      <span>好友申请、群申请和邀请会显示在这里</span>
    </div>
  </div>
</div>
