<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>讯岛 · IM 工作台</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --paper: #ffffff;
        --white: #ffffff;
        --mint: #e8eefc;
        --mint-strong: #2563eb;
        --mint-dark: #1d4ed8;
        --coral: #e47a63;
        --amber: #d79838;
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
        --soft-shadow: 0 6px 18px rgba(17, 24, 39, 0.06);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #ffffff;
        color: var(--ink);
        font-family:
          "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }
      [v-cloak] {
        display: none;
      }

      .page-shell {
        height: 100vh;
        padding: 0;
      }
      .auth-layout {
        display: flex;
        height: 100%;
        overflow: hidden;
        background: var(--white);
      }
      .auth-intro {
        position: relative;
        display: flex;
        width: 54%;
        min-height: 0;
        flex-direction: column;
        justify-content: space-between;
        padding: 54px 58px;
        overflow: hidden;
        background: #111827;
        color: #ffffff;
      }
      .auth-intro::before {
        position: absolute;
        right: -150px;
        bottom: -200px;
        width: 520px;
        height: 520px;
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 50%;
        box-shadow:
          0 0 0 34px rgba(148, 163, 184, 0.1),
          0 0 0 70px rgba(148, 163, 184, 0.06);
        content: "";
      }
      .auth-intro::after {
        position: absolute;
        top: 23%;
        right: 20%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #efb27f;
        box-shadow:
          42px 90px 0 #60a5fa,
          -110px 160px 0 #efb27f;
        content: "";
      }
      .brand-lockup,
      .intro-copy,
      .intro-foot {
        position: relative;
        z-index: 1;
      }
      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .brand-mark {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 18px;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: #93c5fd;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .intro-copy h1 {
        max-width: 520px;
        margin: 0;
        font-family: Georgia, "Songti SC", serif;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0;
      }
      .intro-copy p {
        max-width: 430px;
        margin: 25px 0 0;
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.9;
      }
      .intro-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #94a3b8;
        font-size: 13px;
      }
      .live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2563eb;
        box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.14);
      }
      .auth-panel {
        display: flex;
        width: 46%;
        min-height: 0;
        align-items: center;
        justify-content: center;
        padding: 48px;
        overflow: auto;
        background: #ffffff;
      }
      .auth-card {
        width: min(100%, 390px);
      }
      .auth-card h2 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }
      .auth-subtitle {
        margin: 10px 0 29px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      .auth-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 25px;
        padding: 4px;
        border-radius: 12px;
        background: #f3f4f6;
      }
      .auth-tab {
        flex: 1;
        padding: 11px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
      }
      .auth-tab.active {
        background: var(--white);
        color: var(--mint-dark);
        box-shadow: 0 2px 8px rgba(17, 24, 39, 0.08);
        font-weight: 700;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        margin-bottom: 8px;
        color: #4b5563;
        font-size: 12px;
        font-weight: 700;
      }
      .field input,
      .field textarea,
      .search-input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
        background: var(--white);
        color: var(--ink);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .field input {
        height: 46px;
        padding: 0 13px;
      }
      .field textarea {
        min-height: 88px;
        padding: 11px 13px;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus,
      .search-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      .primary-button {
        width: 100%;
        height: 48px;
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: var(--mint-dark);
        color: #fff;
        font-weight: 700;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .primary-button:hover {
        transform: translateY(-1px);
        background: #1e40af;
      }
      .form-hint {
        min-height: 20px;
        margin: 14px 0 0;
        color: var(--coral);
        font-size: 12px;
        line-height: 1.5;
      }

      .workspace {
        display: flex;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
        background: var(--paper);
      }
      .topbar {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }
      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mint-dark);
        font-weight: 800;
      }
      .topbar-brand .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        font-size: 13px;
      }
      .topbar-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .connection-state {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .profile-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }
      .avatar {
        display: inline-flex;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--mint);
        color: var(--mint-dark);
        font-size: 14px;
        font-weight: 800;
      }
      .profile-name {
        font-size: 13px;
        font-weight: 700;
      }
      .profile-role {
        margin-top: 1px;
        color: var(--muted);
        font-size: 11px;
      }
      .ghost-button,
      .danger-button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: #607169;
        font-size: 12px;
      }
      .ghost-button {
        padding: 8px 11px;
      }
      .topbar .ghost-button,
      .topbar .danger-button {
        padding: 5px 8px;
      }
      .topbar .avatar {
        width: 26px;
        height: 26px;
        flex-basis: 26px;
        font-size: 11px;
      }
      .ghost-button:hover {
        border-color: #93c5fd;
        color: var(--mint-dark);
      }
      .danger-button {
        padding: 7px 10px;
        border-color: #f0d4cc;
        color: #b65641;
        background: #fffafa;
      }
      .danger-button:hover {
        background: #fff0ec;
      }
      .workspace-body {
        display: flex;
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }
      .sidebar {
        display: flex;
        width: 220px;
        flex: 0 0 220px;
        flex-direction: column;
        padding: 28px 18px;
        border-right: 1px solid var(--line);
        background: #ffffff;
      }
      .sidebar-label {
        margin: 0 12px 12px;
        color: #9ca3af;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .nav-button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 11px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #4b5563;
        text-align: left;
        font-size: 13px;
      }
      .nav-button.active {
        background: var(--mint);
        color: var(--mint-dark);
        font-weight: 800;
      }
      .nav-icon {
        display: inline-flex;
        width: 20px;
        justify-content: center;
        color: currentColor;
        font-size: 15px;
      }
      .sidebar-note {
        margin: auto 10px 0;
        padding: 16px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
      }
      .sidebar-note strong {
        display: block;
        color: var(--mint-dark);
        font-size: 12px;
      }
      .sidebar-note span {
        display: block;
        margin-top: 7px;
        color: #6b7280;
        font-size: 11px;
        line-height: 1.6;
      }
      .main-panel {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        padding: 24px 28px;
        overflow: hidden;
      }
      .workspace-summary {
        flex: 0 0 auto;
      }
      .workspace-content {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      .page-heading h2 {
        margin: 0;
        font-family: Georgia, "Songti SC", serif;
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .page-heading p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .heading-action {
        display: flex;
        gap: 9px;
      }
      .heading-action .ghost-button {
        min-width: 90px;
        height: 37px;
      }
      .metric-row {
        display: flex;
        gap: 14px;
        margin-bottom: 14px;
      }
      .metric-card {
        min-width: 0;
        flex: 1;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--white);
      }
      .metric-label {
        color: var(--muted);
        font-size: 11px;
      }
      .metric-value {
        margin-top: 5px;
        color: var(--ink);
        font-family: Georgia, serif;
        font-size: 24px;
      }
      .metric-caption {
        margin-top: 2px;
        color: var(--mint-strong);
        font-size: 11px;
      }
      .chat-layout {
        display: flex;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--white);
        box-shadow: var(--soft-shadow);
      }
      .workspace-content > .chat-layout,
      .workspace-content > .members-panel,
      .workspace-content > .community-panel,
      .workspace-content > .request-panel {
        min-height: 0;
        flex: 1;
      }
      .workspace-content.contacts-content {
        display: block;
        overflow: auto;
      }
      .workspace-content.contacts-content > .members-panel,
      .workspace-content.contacts-content > .community-panel,
      .workspace-content.contacts-content > .request-panel {
        min-height: auto;
        flex: none;
        overflow: visible;
      }
      .contact-pane {
        display: flex;
        width: 285px;
        min-height: 0;
        flex: 0 0 285px;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: #ffffff;
      }
      .contact-head {
        padding: 19px 18px 13px;
      }
      .contact-head h3 {
        margin: 0 0 13px;
        font-size: 14px;
      }
      .search-input {
        height: 36px;
        padding: 0 11px;
        font-size: 12px;
      }
      .contact-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
      }
      .contact-row {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 13px 18px;
        border: 0;
        border-bottom: 1px solid #f3f4f6;
        background: transparent;
        text-align: left;
      }
      .contact-row:hover {
        background: #f8fafc;
      }
      .contact-row.active {
        background: var(--mint);
      }
      .contact-copy {
        min-width: 0;
        flex: 1;
      }
      .contact-name {
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contact-preview {
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contact-id {
        color: #9aa9a0;
        font-size: 10px;
      }
      .chat-pane {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        background: #fff;
      }
      .chat-head {
        display: flex;
        min-height: 72px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        padding: 16px 23px;
        border-bottom: 1px solid var(--line);
      }
      .chat-user {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .chat-user strong {
        display: block;
        font-size: 14px;
      }
      .chat-user span {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .socket-tag {
        color: var(--muted);
        font-size: 11px;
      }
      .socket-tag.connected {
        color: var(--mint-strong);
      }
      .message-stream {
        min-height: 0;
        flex: 1;
        padding: 24px;
        overflow: auto;
        background: #ffffff;
      }
      .empty-state {
        display: flex;
        height: 100%;
        min-height: 250px;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 12px;
        text-align: center;
      }
      .empty-state strong {
        display: block;
        margin-bottom: 6px;
        color: #6b7280;
        font-size: 14px;
      }
      .message-item {
        display: flex;
        margin-bottom: 15px;
      }
      .message-item.mine {
        justify-content: flex-end;
      }
      .message-bubble {
        padding: 11px 14px;
        border-radius: 13px 13px 13px 3px;
        background: #f3f4f6;
        color: #374151;
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .message-bubble.emoji-bubble {
        padding: 4px;
        background: transparent;
      }
      .message-bubble.image-bubble {
        padding: 4px;
        background: transparent;
      }
      .message-item.mine .message-bubble.emoji-bubble {
        background: transparent;
      }
      .message-item.mine .message-bubble.image-bubble {
        background: transparent;
      }
      .message-emoji {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 12px;
        object-fit: contain;
      }
      .message-image {
        display: block;
        max-width: min(320px, 60vw);
        max-height: 240px;
        border-radius: 10px;
        object-fit: contain;
      }
      .message-item.mine .message-bubble {
        border-radius: 13px 13px 3px 13px;
        background: var(--mint-dark);
        color: #ffffff;
      }
      .message-meta {
        margin-top: 5px;
        color: #9ca3af;
        font-size: 10px;
      }
      .message-item.mine .message-meta {
        text-align: right;
      }
      .composer {
        position: relative;
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        margin: 10px 18px 14px;
        padding: 10px 12px 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
      }
      .composer-tools {
        position: relative;
        z-index: 2;
        display: flex;
        flex: 0 0 34px;
        align-items: center;
        gap: 3px;
        order: 2;
        padding-right: 180px;
      }
      .composer-icon-button,
      .emoji-button {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mint-dark);
        font-size: 19px;
        line-height: 1;
      }
      .emoji-button {
        order: 1;
      }
      .composer-icon-button {
        order: 2;
      }
      .composer-icon-button:hover,
      .emoji-button:hover,
      .emoji-button.active {
        background: var(--mint);
        color: var(--mint-dark);
      }
      .image-button {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mint-dark);
        font-size: 18px;
        line-height: 1;
        order: 3;
      }
      .image-button:hover {
        background: var(--mint);
        color: var(--mint-dark);
      }
      .image-input {
        display: none;
      }
      .toolbar-caret {
        margin-left: -2px;
        color: #7b8490;
        font-size: 12px;
      }
      .emoji-panel {
        position: absolute;
        z-index: 5;
        bottom: 38px;
        left: 0;
        width: 300px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }
      .emoji-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .emoji-grid {
        display: grid;
        max-height: 220px;
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
        overflow: auto;
      }
      .emoji-option {
        display: inline-flex;
        width: 46px;
        height: 46px;
        align-items: center;
        justify-content: center;
        padding: 4px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: #f8fafc;
      }
      .emoji-option:hover {
        border-color: #93c5fd;
        background: #eff6ff;
      }
      .emoji-option img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .emoji-empty {
        padding: 20px 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .composer textarea {
        width: 100%;
        min-height: 96px;
        max-height: 150px;
        flex: 1 1 auto;
        order: 1;
        padding: 4px 6px;
        border: 0;
        border-radius: 8px;
        outline: 0;
        resize: none;
        font-size: 13px;
      }
      .composer textarea:focus {
        border-color: #cbd5e1;
        box-shadow: none;
      }
      .voice-button {
        position: absolute;
        right: 100px;
        bottom: 10px;
        z-index: 2;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mint-dark);
        font-size: 18px;
      }
      .voice-button:hover {
        background: var(--mint);
        color: var(--mint-dark);
      }
      .toolbar-divider {
        position: absolute;
        right: 88px;
        bottom: 13px;
        z-index: 2;
        width: 1px;
        height: 22px;
        background: var(--line);
      }
      .send-button {
        position: absolute;
        right: 12px;
        bottom: 8px;
        z-index: 2;
        width: 70px;
        height: 34px;
        border: 0;
        border-radius: 8px;
        background: var(--mint-dark);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        order: 3;
      }
      .send-button:hover {
        background: #1e40af;
      }
      .members-panel {
        min-height: 0;
        flex: 1;
        padding: 3px 0;
        overflow: auto;
      }
      .friend-search-panel {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 14px;
        padding: 15px 17px;
        border: 1px solid var(--line);

    <link rel="stylesheet" href="/asset/mobile.css?v=mobile-1" />
  </head>
  <body>
    <div id="app" v-cloak class="page-shell">
      <transition name="fade">
        <div
          v-if="toast.visible"
          class="toast"
          :class="{ error: toast.type === 'error' }"
        >
          {{ toast.message }}
        </div>
      </transition>
      <div id="auth-module"></div>
      <div id="workspace-module"></div>
      <div id="member-modal-module"></div>
    </div>
    <script>
      // 先加载业务片段，再挂载 Vue，确保各模块共享同一个应用状态。
      ;(async function mountApp() {
        const modulePaths = [
          ["/views/user/login.html?v=mobile-1", "#auth-module"],
          ["/views/index/workspace.html?v=mobile-1", "#workspace-module"],
          ["/views/message/index.html?v=mobile-1", "#chat-module"],
          ["/views/user/index.html?v=mobile-1", "#member-module"],
          ["/views/community/index.html?v=mobile-1", "#community-module"],
          ["/views/relation/index.html?v=mobile-1", "#request-module"],
          ["/views/user/modal.html", "#member-modal-module"]
        ]
        const fragments = await Promise.all(
          modulePaths.map(async ([path]) => {
            const response = await fetch(path)
            if (!response.ok) throw new Error("模块加载失败：" + path)
            return response.text()
          })
        )
        modulePaths.forEach(([, selector], index) => {
          const target = document.querySelector(selector)
          if (target) target.outerHTML = fragments[index]
        })
        const { createApp } = Vue
        // 统一封装请求地址与表单编码，保持 Go 服务端 PostForm 接收方式不变。
        const API_ROOT = window.__IM_API_ROOT__ || "http://localhost:8080"
        const api = axios.create({ baseURL: API_ROOT, timeout: 8000 })
        api.interceptors.request.use((config) => {
          // 每次请求从会话存储读取最新 token，避免刷新页面后丢失认证头。
          const cachedSession = sessionStorage.getItem("im-session")
          if (cachedSession) {
            try {
              const session = JSON.parse(cachedSession)
              if (session.token) {
                config.headers.Authorization = `Bearer ${session.token}`
              }
            } catch (error) {
              sessionStorage.removeItem("im-session")
            }
          }
          return config
        })
        api.interceptors.response.use(
          (response) => response,
          (error) => Promise.reject(error)
        )

        createApp({
          data() {
            return {
              authMode: "login",
              loading: false,
              authError: "",
              currentView: "chat",
              contactSection: "friends",
              searchText: "",
              contactSearchText: "",
              userSearchKeyword: "",
              userSearchResult: null,
              userSearchLoading: false,
              friendAdding: false,
              draft: "",
              emojis: [],
              emojiPanelOpen: false,
              emojiLoading: false,
              emojiError: "",
              uploadingImage: false,
              authForm: { name: "", password: "", repassword: "" },
              session: { user: null, token: "" },
              users: [],
              friends: [],
              communities: [],
              relationRequests: [],
              relationLoading: false,
              relationAction: null,
              communityInviteTarget: "",
              communityLoading: false,
              communitySaving: false,
              communityJoining: false,
              communityJoinKeyword: "",
              communityForm: { name: "", desc: "" },
              conversations: [],
              selectedUser: null,
              selectedConversation: null,
              messages: [],
              messageLoading: false,
              messageHistoryRequest: 0,
              conversationDeleting: false,
              socket: null,
              socketConnected: false,
              readTimers: new Map(),
              toast: {
                visible: false,
                message: "",
                type: "success",
                timer: null
              },
              memberModal: { visible: false, editing: false, error: "" },
              passwordModal: { visible: false, error: "" },
              passwordSaving: false,
              friendModal: { visible: false, person: {} },
              memberForm: {
                id: "",
                name: "",
                phone: "",
                email: "",
                identity: ""
              },
              passwordForm: {
                old_password: "",
                new_password: "",
                re_new_password: ""
              }
            }
          },
          computed: {
            filteredConversations() {
              const keyword = this.searchText.toLowerCase()
              return this.conversations.filter(
                (conversation) =>
                  !keyword ||
                  this.conversationName(conversation)
                    .toLowerCase()
                    .includes(keyword)
              )
            },
            filteredFriends() {
              const keyword = this.searchText.toLowerCase()
              return this.friends.filter(
                (item) =>
                  this.userId(item) !== String(this.session.user.id) &&
                  (!keyword ||
                    this.personName(item).toLowerCase().includes(keyword))
              )
            },
            filteredContacts() {
              const keyword = this.contactSearchText.toLowerCase()
              return this.friends.filter(
                (item) =>
                  this.userId(item) !== String(this.session.user.id) &&
                  (!keyword ||
                    this.personName(item).toLowerCase().includes(keyword) ||
                    this.personPhone(item).includes(keyword) ||
                    this.personEmail(item).toLowerCase().includes(keyword))
              )
            },
            pendingRequestCount() {
              return this.relationRequests.filter((item) =>
                this.requestCanAct(item)
              ).length
            }
          },
          mounted() {
            this.loadEmojis()
            this.renderIcons()
            const cached = sessionStorage.getItem("im-session")
            if (cached) {
              try {
                this.session = JSON.parse(cached)
                if (this.session.user)
                  this.session.user.id = String(this.session.user.id)
                Promise.all([
                  this.refreshConversations(),
                  this.refreshFriends()
                ])
                this.connectSocket()
              } catch (error) {
                sessionStorage.removeItem("im-session")
              }
            }
          },
          updated() {
            this.renderIcons()
          },
          methods: {
            renderIcons() {
              // 动态片段切换后重新渲染图标，避免条件视图出现空白按钮。
              this.$nextTick(() => window.lucide?.createIcons())
            },
            formBody(data) {
              return new URLSearchParams(
                Object.entries(data).map(([key, value]) => [
                  key,
                  value == null ? "" : String(value)
                ])
              )
            },
            userId(person) {
              // 所有业务 ID 按字符串发送，避免数字精度和类型不一致。
              return String(
                person?.user_id ??
                  person?.UserId ??
                  person?.id ??
                  person?.ID ??
                  ""
              )
            },
            // 统一读取后端大小写字段，兼容列表和详情响应。
            personName(person) {
              return String(person?.name ?? person?.Name ?? "")
            },
            personPhone(person) {
              return String(person?.phone ?? person?.Phone ?? "")
            },
            personEmail(person) {
              return String(person?.email ?? person?.Email ?? "")
            },
            personIdentity(person) {
              return String(person?.identity ?? person?.Identity ?? "")
            },
            personAvatar(person) {
              return String(person?.avatar ?? person?.Avatar ?? "")
            },
            communityId(community) {
              return String(
                community?.community_id ??
                  community?.CommunityId ??
                  community?.id ??
                  community?.ID ??
                  ""
              )
            },
            communityName(community) {
              return String(
                community?.community_name ??
                  community?.CommunityName ??
                  community?.name ??
                  community?.Name ??
                  ""
              )
            },
            communityImg(community) {
              return String(community?.img ?? community?.Img ?? "")
            },
            communityDesc(community) {
              return String(community?.desc ?? community?.Desc ?? "")
            },
            communityIsOwner(community) {
              return Boolean(community?.is_owner ?? community?.IsOwner)
            },
            conversationId(conversation) {
              return String(
                conversation?.conversation_id ??
                  conversation?.ConversationId ??
                  conversation?.id ??
                  conversation?.ID ??
                  ""
              )
            },
            responseCode(payload) {
              return payload?.code ?? payload?.Code
            },
            responseData(payload) {
              return payload?.data ?? payload?.Data
            },
            toBoolean(value) {
              return (
                value === true ||
                value === 1 ||
                value === "1" ||
                value === "true"
              )
            },
            normalizeConversation(item, targetOverride = null) {
              const type = Number(item?.type ?? item?.Type ?? 0)
              const targetInfo = item?.target_info ?? item?.TargetInfo ?? {}
              const targetId = String(
                targetInfo?.target_id ??
                  targetInfo?.TargetId ??
                  targetInfo?.id ??
                  targetInfo?.ID ??
                  ""
              )
              const targetName = String(
                targetInfo?.name ?? targetInfo?.Name ?? ""
              )
              const targetAvatar = String(
                targetInfo?.avatar ?? targetInfo?.Avatar ?? ""
              )
              const target =
                targetOverride ||
                (type === 1
                  ? {
                      community_id: targetId,
                      community_name: targetName,
                      name: targetName,
                      img: targetAvatar
                    }
                  : {
                      user_id: targetId,
                      name: targetName,
                      avatar: targetAvatar
                    })
              const last =
                item?.last_message_info ?? item?.LastMessageInfo ?? {}
              const rawMessageId = last?.message_id ?? last?.MessageId ?? 0
              const hasLastMessage = Number(rawMessageId) > 0
              const createdAt = hasLastMessage
                ? (last?.created_at ?? last?.CreateAt ?? last?.createdAt ?? "")
                : ""
              return {
                id: this.conversationId(item),
                type,
                target,
                isPinned: this.toBoolean(item?.is_pinned ?? item?.IsPinned),
                isMuted: this.toBoolean(item?.is_muted ?? item?.IsMuted),
                unreadCount: Number(
                  item?.unread_count ?? item?.UnreadCount ?? 0

              if (!this.socket || this.socket.readyState !== WebSocket.OPEN) {

            async submitAuth() {

                this.authMode === "register" &&
                this.authForm.password !== this.authForm.repassword
              ) {

                return
              }
              this.loading = true
              this.authError = ""
              try {
                const endpoint =
                  this.authMode === "login" ? "/user/login" : "/user/register"
                const response = await api.post(
                  endpoint,
                  this.formBody(this.authForm)
                )
                const body = response.data || {}
                if (this.authMode === "register") {
                  if (body.code !== 0)
                    throw new Error(body.message || "注册失败")
                  this.authMode = "login"
                  this.authForm.repassword = ""
                  this.showToast("注册成功，请登录")
                  return
                }
                const result = body.data || body.Data
                if ((body.code ?? body.Code) !== 0 || !result)
                  throw new Error(body.msg || body.message || "登录失败")
                this.session = {
                  user: {
                    id: String(result.user_id || result.id || result.ID),
                    name: result.name || this.authForm.name
                  },
                  token: result.token || ""
                }
                this.currentView = "chat"
                this.contactSection = "friends"
                sessionStorage.setItem(
                  "im-session",
                  JSON.stringify(this.session)
                )

                await Promise.all([
                  this.refreshConversations(),
                  this.refreshFriends()

                  error.response?.data?.msg ||
                  error.response?.data?.message ||

            requestId(item) {

            },
            requestIsPending(item) {
              return Number(item.status ?? item.Status) === 1
            },
            requestIsOutgoing(item) {
              const type = Number(item.type ?? item.Type)
              return type === 1 && Boolean(item.target_user || item.TargetUser)
            },
            requestPersonName(item) {
              const type = Number(item.type ?? item.Type)
              let person = null
              if (type === 1) {
                person = this.requestIsOutgoing(item)
                  ? item.target_user || item.TargetUser
                  : item.request_user || item.RequestUser
              } else if (type === 2) {
                person = item.target_user || item.TargetUser
              } else if (type === 3) {
                person = item.invite_from || item.InviteFrom
              }
              return this.personName(person) || "用户"
            },
            requestTitle(item) {
              const type = Number(item.type ?? item.Type)
              if (type === 1) {
                return this.requestIsOutgoing(item)
                  ? `已向 ${this.requestPersonName(item)} 发送好友申请`
                  : `${this.requestPersonName(item)} 请求添加好友`
              }
              if (type === 2)
                return `${this.requestPersonName(item)} 请求加入群聊`
              if (type === 3) {
                return `${this.communityName(item.community || item.Community) || "群聊"} 邀请你加入`
              }
              return "关系申请"
            },
            requestDescription(item) {
              const community = item.community || item.Community
              const message = item.message || item.Message
              if (message) return message
              if (community) return this.communityName(community)
              if (this.requestIsOutgoing(item)) return "等待对方处理"
              return "请确认是否接受这条申请"
            },
            requestStatusText(item) {
              const status = Number(item.status ?? item.Status)
              return status === 1
                ? "待处理"
                : status === 2
                  ? "已接受"
                  : "已拒绝"
            },
            requestCanAct(item) {
              // 自己发出的好友申请只展示状态，不能由发送方处理。
              return (
                this.requestIsPending(item) && !this.requestIsOutgoing(item)
              )

            async createConversation(endpoint, payload, type, target) {
              const response = await api.post(endpoint, this.formBody(payload))
              const body = response.data || {}
              if (this.responseCode(body) !== 0)
                throw new Error(body.msg || body.message || "创建会话失败")
              const data = this.responseData(body) || {}
              const conversationId = this.conversationId(data)
              if (!conversationId) throw new Error("创建会话响应缺少会话 ID")
              const conversation = this.normalizeConversation(
                {
                  conversation_id: conversationId,
                  type,
                  target_info:
                    type === 1
                      ? {
                          target_id: this.communityId(target),
                          name: this.communityName(target),
                          avatar: this.communityImg(target)
                        }
                      : {
                          target_id: this.userId(target),
                          name: this.personName(target),
                          avatar: this.personAvatar(target)
                        }
                },
                target
              )
              const existing = this.conversations.find(
                (item) => item.id === conversation.id
              )
              const nextConversation = existing
                ? { ...existing, type, target }
                : conversation
              this.upsertConversation(nextConversation)
              return nextConversation
            },
            upsertConversation(conversation) {
              const index = this.conversations.findIndex(
                (item) => item.id === conversation.id
              )
              if (index < 0) {
                this.conversations = [conversation, ...this.conversations]
                return
              }
              const next = this.conversations.slice()
              next[index] = { ...next[index], ...conversation }
              this.conversations = next
            },
            async selectUser(person) {
              const targetId = this.userId(person)
              if (!targetId || !this.session.user) return
              try {
                const conversation = await this.createConversation(
                  "/conversation/getPrivateConversationId",
                  { target_id: targetId },
                  2,
                  person
                )
                await this.openConversation(conversation)
              } catch (error) {
                this.showToast(
                  error.response?.data?.msg || error.message || "创建私聊失败",
                  "error"
                )
              }
            },
            async selectCommunity(community) {

              if (!communityId || !this.session.user) return
              try {

                )

            async openConversation(conversation) {
              if (!conversation?.id) return
              this.currentView = "chat"
              this.selectedConversation = conversation
              this.selectedUser = conversation.target
              this.messages = []
              this.emojiPanelOpen = false
              this.connectSocket()
              const loaded = await this.loadMessageHistory()
              if (
                loaded &&
                this.selectedConversation?.id === conversation.id &&
                Number(conversation.unreadCount) > 0
              )
                this.scheduleConversationRead(conversation.id)
            },
            closeConversation() {
              this.messageHistoryRequest += 1
              this.messageLoading = false
              this.selectedUser = null
              this.selectedConversation = null
              this.messages = []
              this.emojiPanelOpen = false
              this.currentView = "chat"
            },
            async loadMessageHistory() {
              const conversationId = this.selectedConversation?.id
              if (!conversationId) return
              const requestId = ++this.messageHistoryRequest
              this.messageLoading = true
              try {
                const response = await api.get("/msg/getMessageList", {
                  params: {
                    conversation_id: conversationId,
                    limit: 30,
                    page: 1
                  }
                })
                if (
                  requestId !== this.messageHistoryRequest ||
                  this.selectedConversation?.id !== conversationId
                )
                  return false
                const payload = response.data || {}
                if (this.responseCode(payload) !== 0)
                  throw new Error(
                    payload.msg || payload.message || "历史消息加载失败"
                  )
                const list = this.responseData(payload) ?? payload.Rows ?? []
                if (!Array.isArray(list))
                  throw new Error("历史消息响应格式错误")
                const historyMessages = list
                  .slice()
                  .reverse()
                  .map((item) => {
                    const fromInfo = item.from_info ?? item.FromInfo ?? {}
                    const createdAt = item.created_at ?? item.CreatedAt ?? ""
                    return {
                      id: String(
                        item.message_id ??
                          item.MessageId ??
                          `${Date.now()}-${Math.random()}`
                      ),
                      content: String(item.content ?? item.Content ?? ""),
                      media: Number(item.media ?? item.Media ?? 1),
                      url: String(item.url ?? item.Url ?? ""),
                      mine: this.toBoolean(item.is_self ?? item.IsSelf),
                      fromName: String(fromInfo.name ?? fromInfo.Name ?? ""),
                      createdAt,
                      time: this.formatMessageTime(createdAt)
                    }
                  })
                const historyIds = new Set(
                  historyMessages.map((message) => message.id)
                )
                // 保留历史请求期间已由 WebSocket 收到的新消息。
                this.messages = [
                  ...historyMessages,
                  ...this.messages.filter(
                    (message) => !historyIds.has(message.id)
                  )
                ]
                this.scrollMessages()
                return true
              } catch (error) {
                if (
                  requestId !== this.messageHistoryRequest ||
                  this.selectedConversation?.id !== conversationId
                )
                  return false
                this.messages = []
                this.showToast(
                  error.response?.data?.msg ||
                    error.message ||
                    "历史消息加载失败",
                  "error"
                )
                return false
              } finally {
                if (requestId === this.messageHistoryRequest)
                  this.messageLoading = false
              }
            },
            async markConversationRead(conversationId) {
              if (!conversationId) return
              try {
                const response = await api.post(
                  "/msg/readMessage",
                  this.formBody({ conversation_id: conversationId })
                )
                const payload = response.data || {}
                if (this.responseCode(payload) !== 0)
                  throw new Error(payload.msg || "设置已读失败")

                // 后端确认后再同步本地未读数，避免刷新时状态反复。
                this.conversations = this.conversations.map((conversation) =>
                  conversation.id === String(conversationId)
                    ? { ...conversation, unreadCount: 0 }
                    : conversation
                )
                if (
                  this.selectedConversation?.id === String(conversationId)
                ) {
                  this.selectedConversation =
                    this.conversations.find(
                      (conversation) =>
                        conversation.id === String(conversationId)
                    ) || this.selectedConversation
                }
              } catch (error) {
                this.showToast(
                  error.response?.data?.msg ||
                    error.message ||
                    "设置已读失败",
                  "error"
                )
              }
            },
            scheduleConversationRead(conversationId) {
              const id = String(conversationId || "")
              if (!id) return
              clearTimeout(this.readTimers.get(id))
              const timer = setTimeout(() => {
                this.readTimers.delete(id)
                void this.markConversationRead(id)
              }, 100)
              this.readTimers.set(id, timer)
            },
            cancelConversationRead(conversationId) {
              const id = String(conversationId || "")
              if (!id) return
              clearTimeout(this.readTimers.get(id))
              this.readTimers.delete(id)
            },
            async deleteConversation() {
              const conversation = this.selectedConversation
              if (!conversation?.id || this.conversationDeleting) return
              if (
                !window.confirm(
                  `确定删除与“${this.conversationName(conversation)}”的会话吗？`
                )
              )
                return

              this.conversationDeleting = true
              try {
                const response = await api.post(
                  "/conversation/deleteConversation",
                  this.formBody({ conversation_id: conversation.id })
                )
                const payload = response.data || {}
                if (this.responseCode(payload) !== 0)
                  throw new Error(payload.msg || "删除会话失败")

                this.conversations = this.conversations.filter(
                  (item) => item.id !== conversation.id
                )
                this.cancelConversationRead(conversation.id)
                if (this.selectedConversation?.id === conversation.id)
                  this.closeConversation()
                this.showToast("会话已删除")
              } catch (error) {
                this.showToast(
                  error.response?.data?.msg ||
                    error.message ||
                    "删除会话失败",
                  "error"
                )
              } finally {
                this.conversationDeleting = false
              }
            },
            connectSocket() {
              if (!this.session.user || !this.session.token) return
              if (
                this.socket &&
                (this.socket.readyState === WebSocket.OPEN ||
                  this.socket.readyState === WebSocket.CONNECTING)
              )
                return
              if (this.socket) this.socket.close()
              const base = API_ROOT || window.location.origin
              const wsBase = base.replace(/^http/, "ws")
              // 原生 WebSocket 不能复用 Axios 请求头，Token 通过查询参数交给鉴权中间件。
              const token = encodeURIComponent(this.session.token)
              const socket = new WebSocket(`${wsBase}/msg/chat?token=${token}`)
              this.socket = socket
              socket.onopen = () => {
                this.socketConnected = true
              }
              socket.onclose = () => {
                if (this.socket === socket) {
                  this.socket = null
                  this.socketConnected = false
                }
              }
              socket.onerror = () => {
                if (this.socket === socket) this.socketConnected = false
              }
              socket.onmessage = (event) => {
                if (event.data === "欢迎进入im-system系统的聊天室！") return
                let content = event.data
                let media = 1
                let url = ""
                let fromId = ""
                let conversationId = ""
                let messageId = ""
                let createdAt = new Date().toISOString()
                try {
                  const payload = JSON.parse(event.data)
                  content = payload.Content || payload.content || event.data
                  media = Number(payload.Media || payload.media || 1)
                  // 表情消息的图片地址由后端透传在 url 字段中
                  url = payload.Url || payload.url || ""
                  fromId = String(
                    payload.FromId || payload.fromId || payload.from_id || ""
                  )
                  conversationId = String(
                    payload.ConversationId ||
                      payload.conversationId ||
                      payload.conversation_id ||
                      ""
                  )
                  messageId = String(
                    payload.message_id || payload.MessageId || ""
                  )
                  createdAt =
                    payload.CreatedAt || payload.created_at || createdAt
                } catch (error) {
                  return
                }
                if (!conversationId) return
                const selectedId = this.selectedConversation?.id || ""
                this.updateConversationPreview(
                  conversationId,
                  content,
                  media,
                  createdAt,
                  conversationId !== selectedId
                )
                if (conversationId !== selectedId) {
                  this.showToast("收到一条新消息")
                  return
                }
                this.messages.push({
                  id: messageId || `${Date.now()}-${Math.random()}`,
                  content,
                  media,
                  url,
                  mine: false,
                  fromName: this.messageSenderName(fromId),
                  createdAt,
                  time: this.formatMessageTime(createdAt)
                })
                this.scheduleConversationRead(conversationId)
                this.scrollMessages()
              }
            },
            sendMessage() {
              if (!this.draft || !this.selectedConversation) return
              this.sendChatMessage(this.draft, 1)
            },
            sendEmoji(emoji) {
              if (!emoji || !emoji.file || !this.selectedConversation) return
              this.sendChatMessage("", 2, emoji.name, emoji.file)
            },
            sendChatMessage(content, media, name = "", url = "") {
              const conversationId = this.selectedConversation?.id
              if (!conversationId || !this.session.user) return
              const packet = {
                conversation_id: Number(conversationId),
                media,
                content,
                url
              }
              if (!this.socket || this.socket.readyState !== WebSocket.OPEN) {
                this.showToast("实时通道尚未连接，请稍后重试", "error")
                return
              }
              this.socket.send(JSON.stringify(packet))
              const createdAt = new Date().toISOString()
              this.messages.push({
                id: `${Date.now()}-${Math.random()}`,
                content,
                media,
                name,
                url,
                mine: true,
                fromName: "我",
                createdAt,
                time: this.formatMessageTime(createdAt)
              })
              this.updateConversationPreview(
                conversationId,
                content,
                media,
                createdAt,
                false
              )
              if (media === 1) this.draft = ""
              this.emojiPanelOpen = false
              this.scrollMessages()
            },
            timeNow() {
              return new Date().toLocaleTimeString("zh-CN", {
                hour: "2-digit",
                minute: "2-digit"
              })
            },
            formatMessageTime(value) {
              if (!value) return ""
              const date = new Date(value)
              if (Number.isNaN(date.getTime())) return ""
              return date.toLocaleTimeString("zh-CN", {
                hour: "2-digit",
                minute: "2-digit"
              })
            },
            updateConversationPreview(id, content, media, createdAt, incoming) {
              const conversationId = String(id || "")
              if (!conversationId) return
              const index = this.conversations.findIndex(
                (item) => item.id === conversationId
              )
              if (index < 0) {
                void this.refreshConversations()
                return
              }
              const next = this.conversations.slice()
              const current = next[index]
              const selectedId = this.selectedConversation?.id || ""
              next[index] = {
                ...current,
                unreadCount:
                  incoming && conversationId !== selectedId
                    ? current.unreadCount + 1
                    : conversationId === selectedId
                      ? 0
                      : current.unreadCount,
                lastMessageAt: createdAt,
                lastMessageInfo: {
                  ...current.lastMessageInfo,
                  content: String(content || ""),
                  media: Number(media || 1),
                  createdAt,
                  isSelf: !incoming
                }
              }
              this.conversations = next.sort((left, right) => {
                if (left.isPinned !== right.isPinned)
                  return left.isPinned ? -1 : 1
                const leftTime = new Date(left.lastMessageAt || 0).getTime()
                const rightTime = new Date(right.lastMessageAt || 0).getTime()
                if (leftTime !== rightTime) return rightTime - leftTime
                if (left.id === right.id) return 0
                return left.id > right.id ? -1 : 1
              })
            },
            scrollMessages() {
              this.$nextTick(() => {
                const node = this.$refs.messageStream
                if (node) node.scrollTop = node.scrollHeight
              })
            },
            async logout() {
              let message = "退出登录成功"
              let type = "success"
              try {
                if (this.session.token) {
                  const response = await api.post("/user/loginOut")
                  const body = response.data || {}
                  if ((body.code ?? body.Code) !== 0) {
                    throw new Error(body.msg || body.message || "退出登录失败")
                  }
                }
              } catch (error) {
                message =
                  error.response?.data?.msg ||
                  error.response?.data?.message ||
                  error.message ||
                  "退出登录失败"
                type = "error"
              } finally {
                this.readTimers.forEach((timer) => clearTimeout(timer))
                this.readTimers.clear()
                if (this.socket) this.socket.close()
                sessionStorage.removeItem("im-session")
                this.session = { user: null, token: "" }
                this.users = []
                this.friends = []
                this.communities = []
                this.conversations = []
                this.userSearchResult = null
                this.selectedUser = null
                this.selectedConversation = null
                this.messages = []
                this.currentView = "chat"
                this.contactSection = "friends"
                this.showToast(message, type)
              }
            },
            async openEditProfile() {
              await this.refreshUsers()
              // 仅从当前登录用户的记录填充资料表单，不接受好友对象作为编辑目标。
              const person =
                this.users.find(
                  (item) => this.userId(item) === String(this.session.user.id)
                ) || this.session.user
              this.memberModal = { visible: true, editing: true, error: "" }
              this.memberForm = {
                id: this.session.user.id,
                name: this.personName(person),
                phone: this.personPhone(person),
                email: this.personEmail(person),
                identity: this.personIdentity(person)
              }
            },
            closeMemberModal() {
              this.memberModal.visible = false
            },
            // 密码修改单独使用专用表单，避免混入资料更新请求。
            openPasswordModal() {
              this.passwordModal = { visible: true, error: "" }
              this.passwordForm = {
                old_password: "",
                new_password: "",
                re_new_password: ""
              }
            },
            closePasswordModal() {
              this.passwordModal.visible = false
            },
            viewFriendInfo(person) {
              // 好友资料单独以只读弹窗展示，避免进入当前用户的编辑流程。
              this.friendModal = { visible: true, person }
            },
            closeFriendInfo() {
              this.friendModal.visible = false
            },
            async saveProfile() {
              if (String(this.memberForm.id) !== String(this.session.user.id)) {
                this.memberModal.error = "只能编辑当前登录账号的信息"
                return
              }
              this.loading = true
              this.memberModal.error = ""
              try {
                const response = await api.post(
                  "/user/update",
                  this.formBody({
                    id: String(this.session.user.id),
                    name: this.memberForm.name,
                    phone: this.memberForm.phone,
                    email: this.memberForm.email,
                    identity: this.memberForm.identity
                  })
                )
                const body = response.data || {}
                if ((body.code ?? body.Code) !== 0)
                  throw new Error(body.msg || body.message || "保存失败")
                this.closeMemberModal()
                this.session.user.name = this.memberForm.name
                sessionStorage.setItem(
                  "im-session",
                  JSON.stringify(this.session)
                )
                this.showToast("个人资料已更新")
                await this.refreshFriends()
              } catch (error) {
                this.memberModal.error =
                  error.response?.data?.message || error.message || "保存失败"
              } finally {
                this.loading = false
              }
            },
            async changePassword() {
              if (this.passwordSaving) return
              if (
                !this.passwordForm.old_password ||
                !this.passwordForm.new_password ||
                !this.passwordForm.re_new_password
              ) {
                this.passwordModal.error = "请完整填写密码"
                return
              }
              if (
                this.passwordForm.new_password !==
                this.passwordForm.re_new_password
              ) {
                this.passwordModal.error = "两次新密码不一致"
                return
              }
              this.passwordSaving = true
              this.passwordModal.error = ""
              try {
                const response = await api.post(
                  "/user/changePassword",
                  this.formBody({
                    user_id: String(this.session.user.id),
                    old_password: this.passwordForm.old_password,
                    new_password: this.passwordForm.new_password,
                    re_new_password: this.passwordForm.re_new_password
                  })
                )
                const body = response.data || {}
                if ((body.code ?? body.Code) !== 0)
                  throw new Error(body.msg || body.message || "修改密码失败")
                this.closePasswordModal()
                this.showToast("密码已修改")
              } catch (error) {
                this.passwordModal.error =
                  error.response?.data?.msg ||
                  error.response?.data?.message ||
                  error.message ||
                  "修改密码失败"
              } finally {
                this.passwordSaving = false
              }
            },
            async deactivateAccount() {
              if (
                !window.confirm(
                  "注销账号后将删除当前用户，且无法恢复。确定继续吗？"
                )
              )
                return
              try {
                // 注销仅提交当前会话中的用户 ID，禁止从好友列表传入删除目标。
                const response = await api.get("/user/deleteUser", {
                  params: { id: String(this.session.user.id) }
                })
                if (response.data?.code !== 0)
                  throw new Error(response.data?.message || "注销失败")
                this.logout()
                this.showToast("账号已注销")
              } catch (error) {
                this.showToast(error.message || "注销失败", "error")
              }
            }
          }
        }).mount("#app")
      })().catch((error) => {
        document.querySelector("#app").innerHTML =
          `<div class="empty-state"><div><strong>页面模块加载失败</strong><span>${error.message}</span></div></div>`
      })
    </script>
  </body>
</html>
