<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>讯岛 · IM 工作台</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <style>
      :root {
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --paper: #ffffff;
        --white: #ffffff;
        --mint: #e8eefc;
        --mint-strong: #2563eb;
        --mint-dark: #1d4ed8;
        --coral: #e47a63;
        --amber: #d79838;
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
        --soft-shadow: 0 6px 18px rgba(17, 24, 39, 0.06);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #ffffff;
        color: var(--ink);
        font-family:
          "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }
      [v-cloak] {
        display: none;
      }

      .page-shell {
        height: 100vh;
        padding: 0;
      }
      .auth-layout {
        display: flex;
        height: 100%;
        overflow: hidden;
        background: var(--white);
      }
      .auth-intro {
        position: relative;
        display: flex;
        width: 54%;
        min-height: 0;
        flex-direction: column;
        justify-content: space-between;
        padding: 54px 58px;
        overflow: hidden;
        background: #111827;
        color: #ffffff;
      }
      .auth-intro::before {
        position: absolute;
        right: -150px;
        bottom: -200px;
        width: 520px;
        height: 520px;
        border: 1px solid rgba(148, 163, 184, 0.32);
        border-radius: 50%;
        box-shadow:
          0 0 0 34px rgba(148, 163, 184, 0.1),
          0 0 0 70px rgba(148, 163, 184, 0.06);
        content: "";
      }
      .auth-intro::after {
        position: absolute;
        top: 23%;
        right: 20%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #efb27f;
        box-shadow:
          42px 90px 0 #60a5fa,
          -110px 160px 0 #efb27f;
        content: "";
      }
      .brand-lockup,
      .intro-copy,
      .intro-foot {
        position: relative;
        z-index: 1;
      }
      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .brand-mark {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 18px;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: #93c5fd;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .intro-copy h1 {
        max-width: 520px;
        margin: 0;
        font-family: Georgia, "Songti SC", serif;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0;
      }
      .intro-copy p {
        max-width: 430px;
        margin: 25px 0 0;
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.9;
      }
      .intro-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #94a3b8;
        font-size: 13px;
      }
      .live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2563eb;
        box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.14);
      }
      .auth-panel {
        display: flex;
        width: 46%;
        min-height: 0;
        align-items: center;
        justify-content: center;
        padding: 48px;
        overflow: auto;
        background: #ffffff;
      }
      .auth-card {
        width: min(100%, 390px);
      }
      .auth-card h2 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }
      .auth-subtitle {
        margin: 10px 0 29px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      .auth-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 25px;
        padding: 4px;
        border-radius: 12px;
        background: #f3f4f6;
      }
      .auth-tab {
        flex: 1;
        padding: 11px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
      }
      .auth-tab.active {
        background: var(--white);
        color: var(--mint-dark);
        box-shadow: 0 2px 8px rgba(17, 24, 39, 0.08);
        font-weight: 700;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        margin-bottom: 8px;
        color: #4b5563;
        font-size: 12px;
        font-weight: 700;
      }
      .field input,
      .field textarea,
      .search-input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
        background: var(--white);
        color: var(--ink);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .field input {
        height: 46px;
        padding: 0 13px;
      }
      .field textarea {
        min-height: 88px;
        padding: 11px 13px;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus,
      .search-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      .primary-button {
        width: 100%;
        height: 48px;
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: var(--mint-dark);
        color: #fff;
        font-weight: 700;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .primary-button:hover {
        transform: translateY(-1px);
        background: #1e40af;
      }
      .form-hint {
        min-height: 20px;
        margin: 14px 0 0;
        color: var(--coral);
        font-size: 12px;
        line-height: 1.5;
      }

      .workspace {
        display: flex;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
        background: var(--paper);
      }
      .topbar {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }
      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mint-dark);
        font-weight: 800;
      }
      .topbar-brand .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        font-size: 13px;
      }
      .topbar-meta {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .connection-state {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .profile-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-left: 10px;
        border-left: 1px solid var(--line);
      }
      .avatar {
        display: inline-flex;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--mint);
        color: var(--mint-dark);
        font-size: 14px;
        font-weight: 800;
      }
      .profile-name {
        font-size: 13px;
        font-weight: 700;
      }
      .profile-role {
        margin-top: 1px;
        color: var(--muted);
        font-size: 11px;
      }
      .ghost-button,
      .danger-button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--white);
        color: #607169;
        font-size: 12px;
      }
      .ghost-button {
        padding: 8px 11px;
      }
      .topbar .ghost-button,
      .topbar .danger-button {
        padding: 5px 8px;
      }
      .topbar .avatar {
        width: 26px;
        height: 26px;
        flex-basis: 26px;
        font-size: 11px;
      }
      .ghost-button:hover {
        border-color: #93c5fd;
        color: var(--mint-dark);
      }
      .danger-button {
        padding: 7px 10px;
        border-color: #f0d4cc;
        color: #b65641;
        background: #fffafa;
      }
      .danger-button:hover {
        background: #fff0ec;
      }
      .workspace-body {
        display: flex;
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }
      .sidebar {
        display: flex;
        width: 220px;
        flex: 0 0 220px;
        flex-direction: column;
        padding: 28px 18px;
        border-right: 1px solid var(--line);
        background: #ffffff;
      }
      .sidebar-label {
        margin: 0 12px 12px;
        color: #9ca3af;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .nav-button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 11px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #4b5563;
        text-align: left;
        font-size: 13px;
      }
      .nav-button.active {
        background: var(--mint);
        color: var(--mint-dark);
        font-weight: 800;
      }
      .nav-icon {
        display: inline-flex;
        width: 20px;
        justify-content: center;
        color: currentColor;
        font-size: 15px;
      }
      .sidebar-note {
        margin: auto 10px 0;
        padding: 16px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
      }
      .sidebar-note strong {
        display: block;
        color: var(--mint-dark);
        font-size: 12px;
      }
      .sidebar-note span {
        display: block;
        margin-top: 7px;
        color: #6b7280;
        font-size: 11px;
        line-height: 1.6;
      }
      .main-panel {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        padding: 24px 28px;
        overflow: hidden;
      }
      .workspace-summary {
        flex: 0 0 auto;
      }
      .workspace-content {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      .page-heading h2 {
        margin: 0;
        font-family: Georgia, "Songti SC", serif;
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .page-heading p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .heading-action {
        display: flex;
        gap: 9px;
      }
      .heading-action .ghost-button {
        min-width: 90px;
        height: 37px;
      }
      .metric-row {
        display: flex;
        gap: 14px;
        margin-bottom: 14px;
      }
      .metric-card {
        min-width: 0;
        flex: 1;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--white);
      }
      .metric-label {
        color: var(--muted);
        font-size: 11px;
      }
      .metric-value {
        margin-top: 5px;
        color: var(--ink);
        font-family: Georgia, serif;
        font-size: 24px;
      }
      .metric-caption {
        margin-top: 2px;
        color: var(--mint-strong);
        font-size: 11px;
      }
      .chat-layout {
        display: flex;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--white);
        box-shadow: var(--soft-shadow);
      }
      .workspace-content > .chat-layout,
      .workspace-content > .members-panel {
        min-height: 0;
        flex: 1;
      }
      .contact-pane {
        display: flex;
        width: 285px;
        min-height: 0;
        flex: 0 0 285px;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: #ffffff;
      }
      .contact-head {
        padding: 19px 18px 13px;
      }
      .contact-head h3 {
        margin: 0 0 13px;
        font-size: 14px;
      }
      .search-input {
        height: 36px;
        padding: 0 11px;
        font-size: 12px;
      }
      .contact-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
      }
      .contact-row {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 13px 18px;
        border: 0;
        border-bottom: 1px solid #f3f4f6;
        background: transparent;
        text-align: left;
      }
      .contact-row:hover {
        background: #f8fafc;
      }
      .contact-row.active {
        background: var(--mint);
      }
      .contact-copy {
        min-width: 0;
        flex: 1;
      }
      .contact-name {
        overflow: hidden;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contact-preview {
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .contact-id {
        color: #9aa9a0;
        font-size: 10px;
      }
      .chat-pane {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        background: #fff;
      }
      .chat-head {
        display: flex;
        min-height: 72px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        padding: 16px 23px;
        border-bottom: 1px solid var(--line);
      }
      .chat-user {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .chat-user strong {
        display: block;
        font-size: 14px;
      }
      .chat-user span {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .socket-tag {
        color: var(--muted);
        font-size: 11px;
      }
      .socket-tag.connected {
        color: var(--mint-strong);
      }
      .message-stream {
        min-height: 0;
        flex: 1;
        padding: 24px;
        overflow: auto;
        background: #ffffff;
      }
      .empty-state {
        display: flex;
        height: 100%;
        min-height: 250px;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        font-size: 12px;
        text-align: center;
      }
      .empty-state strong {
        display: block;
        margin-bottom: 6px;
        color: #6b7280;
        font-size: 14px;
      }
      .message-item {
        display: flex;
        margin-bottom: 15px;
      }
      .message-item.mine {
        justify-content: flex-end;
      }
      .message-bubble {
        padding: 11px 14px;
        border-radius: 13px 13px 13px 3px;
        background: #f3f4f6;
        color: #374151;
        font-size: 13px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .message-bubble.emoji-bubble {
        padding: 4px;
        background: transparent;
      }
      .message-item.mine .message-bubble.emoji-bubble {
        background: transparent;
      }
      .message-emoji {
        display: block;
        width: 96px;
        height: 96px;
        border-radius: 12px;
        object-fit: contain;
      }
      .message-item.mine .message-bubble {
        border-radius: 13px 13px 3px 13px;
        background: var(--mint-dark);
        color: #ffffff;
      }
      .message-meta {
        margin-top: 5px;
        color: #9ca3af;
        font-size: 10px;
      }
      .message-item.mine .message-meta {
        text-align: right;
      }
      .composer {
        position: relative;
        display: flex;
        flex: 0 0 auto;
        align-items: flex-end;
        gap: 12px;
        padding: 15px 18px;
        border-top: 1px solid var(--line);
      }
      .composer-tools {
        position: relative;
        flex: 0 0 auto;
      }
      .emoji-button {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #ffffff;
        color: var(--mint-dark);
        font-size: 20px;
        line-height: 1;
      }
      .emoji-button:hover,
      .emoji-button.active {
        border-color: #93c5fd;
        background: #eff6ff;
      }
      .emoji-panel {
        position: absolute;
        z-index: 5;
        bottom: 50px;
        left: 0;
        width: 300px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }
      .emoji-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .emoji-grid {
        display: grid;
        max-height: 220px;
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
        overflow: auto;
      }
      .emoji-option {
        display: inline-flex;
        width: 46px;
        height: 46px;
        align-items: center;
        justify-content: center;
        padding: 4px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: #f8fafc;
      }
      .emoji-option:hover {
        border-color: #93c5fd;
        background: #eff6ff;
      }
      .emoji-option img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .emoji-empty {
        padding: 20px 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .composer textarea {
        min-height: 42px;
        max-height: 110px;
        flex: 1;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
        resize: none;
        font-size: 13px;
      }
      .composer textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      .send-button {
        width: 70px;
        height: 42px;
        border: 0;
        border-radius: 9px;
        background: var(--mint-dark);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      .send-button:hover {
        background: #1e40af;
      }
      .members-panel {
        min-height: 0;
        flex: 1;
        padding: 3px 0;
        overflow: auto;
      }
      .members-table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--white);
        overflow: hidden;
        box-shadow: var(--soft-shadow);
      }
      .members-table th,
      .members-table td {
        padding: 15px 17px;
        border-bottom: 1px solid #f3f4f6;
        text-align: left;
        font-size: 12px;
      }
      .members-table th {
        color: var(--muted);
        background: #ffffff;
        font-size: 11px;
        font-weight: 700;
      }
      .members-table tr:last-child td {
        border-bottom: 0;
      }
      .member-cell {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .member-cell strong {
        font-size: 12px;
      }
      .member-cell span {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
      }
      .table-actions {
        display: flex;
        gap: 7px;
      }
      .table-empty {
        padding: 50px 20px;
        color: var(--muted);
        text-align: center;
      }
      .profile-detail-list {
        border-top: 1px solid var(--line);
      }
      .profile-detail-item {
        display: flex;
        min-height: 46px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .profile-detail-item span {
        color: var(--muted);
      }
      .profile-detail-item strong {
        max-width: 64%;
        overflow: hidden;
        color: var(--ink);
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .modal-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        background: rgba(17, 24, 39, 0.34);
      }
      .modal-card {
        width: min(100%, 440px);
        padding: 25px;
        border-radius: 16px;
        background: var(--white);
        box-shadow: var(--shadow);
      }
      .modal-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }
      .modal-heading h3 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 23px;
        font-weight: 400;
      }
      .close-button {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: #f3f4f6;
        color: #6b7280;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        margin-top: 21px;
      }
      .modal-actions .primary-button {
        width: auto;
        min-width: 88px;
        height: 40px;
        margin: 0;
        padding: 0 16px;
      }
      .modal-actions .ghost-button {
        min-width: 78px;
      }
      .toast {
        position: fixed;
        z-index: 20;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 11px 17px;
        border-radius: 9px;
        background: #111827;
        color: #ffffff;
        box-shadow: var(--soft-shadow);
        font-size: 12px;
      }
      .toast.error {
        background: #a54f3c;
      }
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 0.18s;
      }
      .fade-enter-from,
      .fade-leave-to {
        opacity: 0;
      }
      @media (max-width: 960px) {
        .auth-intro {
          display: none;
        }
        .auth-panel {
          width: 100%;
          padding: 36px;
        }
        .topbar {
          min-height: 54px;
          flex-wrap: wrap;
          gap: 12px;
          padding: 12px 20px;
        }
        .topbar-meta {
          flex-wrap: wrap;
          gap: 10px;
        }
        .workspace-body {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          min-height: 62px;
          flex: 0 0 62px;
          flex-direction: row;
          align-items: center;
          padding: 8px 16px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .sidebar-label,
        .sidebar-note {
          display: none;
        }
        .nav-button {
          width: auto;
        }
        .main-panel {
          padding: 20px;
        }
        .chat-layout {
          flex-direction: column;
        }
        .contact-pane {
          width: 100%;
          max-height: 210px;
          flex: 0 0 210px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
      @media (max-width: 640px) {
        .auth-panel {
          padding: 24px;
        }
        .topbar-brand {
          width: 100%;
        }
        .topbar-meta {
          width: 100%;
          justify-content: space-between;
        }
        .connection-state,
        .profile-chip {
          display: none;
        }
        .main-panel {
          padding: 16px;
        }
        .page-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 16px;
        }
        .metric-row {
          gap: 8px;
          margin-bottom: 14px;
        }
        .metric-card {
          padding: 12px;
        }
        .metric-value {
          font-size: 23px;
        }
        .chat-head,
        .composer {
          padding: 12px;
        }
        .message-stream {
          padding: 16px;
        }
        .modal-backdrop {
          padding: 12px;
        }
        .modal-card {
          max-height: calc(100vh - 24px);
          padding: 20px;
          overflow: auto;
        }
        .members-table th,
        .members-table td {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" v-cloak class="page-shell">
      <transition name="fade">
        <div
          v-if="toast.visible"
          class="toast"
          :class="{ error: toast.type === 'error' }"
        >
          {{ toast.message }}
        </div>
      </transition>
      <div id="auth-module"></div>
      <div id="workspace-module"></div>
      <div id="member-modal-module"></div>
    </div>
    <script>
      // 先加载业务片段，再挂载 Vue，确保各模块共享同一个应用状态。
      ;(async function mountApp() {
        const modulePaths = [
          ["/views/user/login.html", "#auth-module"],
          ["/views/index/workspace.html", "#workspace-module"],
          ["/views/message/index.html?v=emoji-2", "#chat-module"],
          ["/views/user/index.html", "#member-module"],
          ["/views/user/modal.html", "#member-modal-module"]
        ]
        const fragments = await Promise.all(
          modulePaths.map(async ([path]) => {
            const response = await fetch(path)
            if (!response.ok) throw new Error("模块加载失败：" + path)
            return response.text()
          })
        )
        modulePaths.forEach(([, selector], index) => {
          const target = document.querySelector(selector)
          if (target) target.outerHTML = fragments[index]
        })
        const { createApp } = Vue
        // 统一封装请求地址与表单编码，保持 Go 服务端 PostForm 接收方式不变。
        const API_ROOT = window.__IM_API_ROOT__ || "http://localhost:8080"
        const api = axios.create({ baseURL: API_ROOT, timeout: 8000 })
        api.interceptors.response.use(
          response => response,
          error => Promise.reject(error)
        )

        createApp({
          data() {
            return {
              authMode: "login",
              loading: false,
              authError: "",
              currentView: "chat",
              searchText: "",
              draft: "",
              emojis: [],
              emojiPanelOpen: false,
              emojiLoading: false,
              emojiError: "",
              authForm: { name: "", password: "", repassword: "" },
              session: { user: null, token: "" },
              users: [],
              friends: [],
              selectedUser: null,
              messages: [],
              socket: null,
              socketConnected: false,
              toast: {
                visible: false,
                message: "",
                type: "success",
                timer: null
              },
              memberModal: { visible: false, editing: false, error: "" },
              friendModal: { visible: false, person: {} },
              memberForm: {
                id: "",
                name: "",
                password: "",
                repassword: "",
                phone: "",
                email: "",
                identity: ""
              }
            }
          },
          computed: {
            filteredFriends() {
              const keyword = this.searchText.toLowerCase()
              return this.friends.filter(
                item =>
                  item.ID !== this.session.user.id &&
                  (!keyword ||
                    String(item.Name || "")
                      .toLowerCase()
                      .includes(keyword))
              )
            }
          },
          mounted() {
            this.loadEmojis()
            const cached = sessionStorage.getItem("im-session")
            if (cached) {
              try {
                this.session = JSON.parse(cached)
                this.refreshFriends()
              } catch (error) {
                sessionStorage.removeItem("im-session")
              }
            }
          },
          methods: {
            formBody(data) {
              return new URLSearchParams(
                Object.entries(data).map(([key, value]) => [
                  key,
                  value == null ? "" : String(value)
                ])
              )
            },
            initials(name) {
              return String(name || "?")
                .trim()
                .slice(0, 1)
                .toUpperCase()
            },
            lastPreview(id) {
              const item = this.messages.find(
                message => message.targetId === id || message.fromId === id
              )
              return item ? item.content : "开始一段新对话"
            },
            showToast(message, type = "success") {
              clearTimeout(this.toast.timer)
              this.toast = {
                visible: true,
                message,
                type,
                timer: setTimeout(() => {
                  this.toast.visible = false
                }, 2600)
              }
            },
            assetUrl(path) {
              if (!path) return ""
              if (/^https?:\/\//i.test(path)) return path
              const base = API_ROOT.replace(/\/$/, "")
              return `${base}${path.startsWith("/") ? "" : "/"}${path}`
            },
            async loadEmojis() {
              this.emojiLoading = true
              this.emojiError = ""
              try {
                const response = await api.get("/msg/getEmojiList")
                const payload = response.data || {}
                const code = payload.code ?? payload.Code
                const list = payload.data ?? payload.Data ?? payload.Rows
                if (code !== 0 || !Array.isArray(list))
                  throw new Error("表情列表响应格式错误")
                this.emojis = list
              } catch (error) {
                this.emojiError = "表情加载失败"
              } finally {
                this.emojiLoading = false
              }
            },
            toggleEmojiPanel() {
              this.emojiPanelOpen = !this.emojiPanelOpen
              if (this.emojiPanelOpen && !this.emojis.length) this.loadEmojis()
            },
            async submitAuth() {
              if (
                this.authMode === "register" &&
                this.authForm.password !== this.authForm.repassword
              ) {
                this.authError = "两次密码不一致"
                return
              }
              this.loading = true
              this.authError = ""
              try {
                const endpoint =
                  this.authMode === "login" ? "/user/login" : "/user/register"
                const response = await api.post(
                  endpoint,
                  this.formBody(this.authForm)
                )
                const body = response.data || {}
                if (this.authMode === "register") {
                  if (body.code !== 0)
                    throw new Error(body.message || "注册失败")
                  this.authMode = "login"
                  this.authForm.repassword = ""
                  this.showToast("注册成功，请登录")
                  return
                }
                const result = body.data && body.data.data ? body.data : body
                if (result.code !== 0 || !result.data)
                  throw new Error(result.message || body.message || "登录失败")
                this.session = {
                  user: { id: result.data.id, name: this.authForm.name },
                  token: result.data.token || ""
                }
                sessionStorage.setItem(
                  "im-session",
                  JSON.stringify(this.session)
                )
                this.showToast("登录成功")
                await this.refreshFriends()
              } catch (error) {
                this.authError =
                  error.response?.data?.message ||
                  error.message ||
                  "接口请求失败，请检查服务是否启动"
              } finally {
                this.loading = false
              }
            },
            async refreshUsers() {
              this.loading = true
              try {
                const response = await api.get("/user/getUserList")
                const payload = response.data || {}
                this.users = Array.isArray(payload.message)
                  ? payload.message
                  : []
              } catch (error) {
                this.showToast(
                  "个人资料加载失败，请确认后端服务已启动",
                  "error"
                )
              } finally {
                this.loading = false
              }
            },
            async refreshFriends() {
              if (!this.session.user) return
              this.loading = true
              try {
                // 联系人仅使用关系表返回的数据，避免将系统全部用户当作好友。
                const response = await api.post(
                  "/contact/getFriendsById",
                  this.formBody({ user_id: this.session.user.id })
                )
                const payload = response.data || {}
                // 兼容后端统一响应的大小写字段和旧版 Rows 字段
                payload.Code = payload.code ?? payload.Code
                payload.Rows = payload.data ?? payload.Data ?? payload.Rows
                if (payload.Code !== 0) throw new Error("好友列表加载失败")
                this.friends = Array.isArray(payload.Rows) ? payload.Rows : []
                if (
                  !this.selectedUser ||
                  !this.friends.some(item => item.ID === this.selectedUser.ID)
                )
                  this.selectedUser = this.filteredFriends[0] || null
                if (this.selectedUser) this.connectSocket()
              } catch (error) {
                this.showToast(
                  "好友列表加载失败，请确认好友关系已建立",
                  "error"
                )
              } finally {
                this.loading = false
              }
            },
            selectUser(person) {
              this.selectedUser = person
              this.messages = []
              this.emojiPanelOpen = false
              this.connectSocket()
            },
            connectSocket() {
              if (!this.selectedUser || !this.session.user) return
              if (this.socket) this.socket.close()
              const base = API_ROOT || window.location.origin
              const wsBase = base.replace(/^http/, "ws")
              this.socket = new WebSocket(
                `${wsBase}/msg/chat?userId=${encodeURIComponent(this.session.user.id)}`
              )
              this.socket.onopen = () => {
                this.socketConnected = true
              }
              this.socket.onclose = () => {
                this.socketConnected = false
              }
              this.socket.onerror = () => {
                this.socketConnected = false
              }
              this.socket.onmessage = event => {
                let content = event.data
                let media = 1
                let url = ""
                try {
                  const payload = JSON.parse(event.data)
                  content = payload.Content || payload.content || event.data
                  media = Number(payload.Media || payload.media || 1)
                  // 表情消息的图片地址由后端透传在 url 字段中
                  url = payload.Url || payload.url || ""
                } catch (error) {}
                this.messages.push({
                  id: `${Date.now()}-${Math.random()}`,
                  content,
                  media,
                  url,
                  mine: false,
                  targetId: this.selectedUser.ID,
                  time: this.timeNow()
                })
                this.scrollMessages()
              }
            },
            sendMessage() {
              if (!this.draft || !this.selectedUser) return
              this.sendChatMessage(this.draft, 1)
            },
            sendEmoji(emoji) {
              if (!emoji || !emoji.file || !this.selectedUser) return
              this.sendChatMessage("", 2, emoji.name, emoji.file)
            },
            sendChatMessage(content, media, name = "", url = "") {
              const packet = {
                type: 2,
                media,
                fromId: this.session.user.id,
                targetId: this.selectedUser.ID,
                content,
                url
              }
              if (!this.socket || this.socket.readyState !== WebSocket.OPEN) {
                this.showToast("实时通道尚未连接，请稍后重试", "error")
                return
              }
              this.socket.send(JSON.stringify(packet))
              this.messages.push({
                id: `${Date.now()}-${Math.random()}`,
                content,
                media,
                name,
                url,
                mine: true,
                targetId: this.selectedUser.ID,
                time: this.timeNow()
              })
              if (media === 1) this.draft = ""
              this.emojiPanelOpen = false
              this.scrollMessages()
            },
            timeNow() {
              return new Date().toLocaleTimeString("zh-CN", {
                hour: "2-digit",
                minute: "2-digit"
              })
            },
            scrollMessages() {
              this.$nextTick(() => {
                const node = this.$refs.messageStream
                if (node) node.scrollTop = node.scrollHeight
              })
            },
            logout() {
              if (this.socket) this.socket.close()
              sessionStorage.removeItem("im-session")
              this.session = { user: null, token: "" }
              this.users = []
              this.friends = []
              this.selectedUser = null
              this.messages = []
            },
            async openEditProfile() {
              await this.refreshUsers()
              // 仅从当前登录用户的记录填充资料表单，不接受好友对象作为编辑目标。
              const person =
                this.users.find(item => item.ID === this.session.user.id) ||
                this.session.user
              this.memberModal = { visible: true, editing: true, error: "" }
              this.memberForm = {
                id: this.session.user.id,
                name: person.Name || "",
                password: "",
                repassword: "",
                phone: person.Phone || "",
                email: person.Email || "",
                identity: person.Identity || ""
              }
            },
            closeMemberModal() {
              this.memberModal.visible = false
            },
            viewFriendInfo(person) {
              // 好友资料单独以只读弹窗展示，避免进入当前用户的编辑流程。
              this.friendModal = { visible: true, person }
            },
            closeFriendInfo() {
              this.friendModal.visible = false
            },
            async saveProfile() {
              if (String(this.memberForm.id) !== String(this.session.user.id)) {
                this.memberModal.error = "只能编辑当前登录账号的信息"
                return
              }
              this.loading = true
              this.memberModal.error = ""
              try {
                const response = await api.post(
                  "/user/update",
                  this.formBody(this.memberForm)
                )
                const body = response.data || {}
                if (body.code !== 0) throw new Error(body.message || "保存失败")
                this.closeMemberModal()
                this.session.user.name = this.memberForm.name
                sessionStorage.setItem(
                  "im-session",
                  JSON.stringify(this.session)
                )
                this.showToast("个人资料已更新")
                await this.refreshFriends()
              } catch (error) {
                this.memberModal.error =
                  error.response?.data?.message || error.message || "保存失败"
              } finally {
                this.loading = false
              }
            },
            async deactivateAccount() {
              if (
                !window.confirm(
                  "注销账号后将删除当前用户，且无法恢复。确定继续吗？"
                )
              )
                return
              try {
                // 注销仅提交当前会话中的用户 ID，禁止从好友列表传入删除目标。
                const response = await api.get("/user/deleteUser", {
                  params: { id: this.session.user.id }
                })
                if (response.data?.code !== 0)
                  throw new Error(response.data?.message || "注销失败")
                this.logout()
                this.showToast("账号已注销")
              } catch (error) {
                this.showToast(error.message || "注销失败", "error")
              }
            }
          }
        }).mount("#app")
      })().catch(error => {
        document.querySelector("#app").innerHTML =
          `<div class="empty-state"><div><strong>页面模块加载失败</strong><span>${error.message}</span></div></div>`
      })
    </script>
  </body>
</html>
