<div v-if="currentView === 'contacts' && contactSection === 'groups'">
  <section class="section-band">
    <div class="section-band-title">
      <strong>创建群聊</strong><span>建立新的讨论空间</span>
    </div>
    <form class="community-create-fields" @submit.prevent="createCommunity">
      <input
        v-model.trim="communityForm.name"
        class="mobile-field"
        maxlength="40"
        placeholder="群名称"
        required
      />
      <textarea
        v-model.trim="communityForm.desc"
        class="mobile-field"
        maxlength="160"
        placeholder="群简介（选填）"
      ></textarea>
      <button
        class="compact-button primary"
        type="submit"
        :disabled="communitySaving"
      >
        {{ communitySaving ? '创建中' : '创建群聊' }}
      </button>
    </form>
  </section>

  <section class="section-band">
    <div class="section-band-title">
      <strong>加入群聊</strong><span>通过群 ID 申请加入</span>
    </div>
    <form class="mobile-inline-form" @submit.prevent="joinCommunity">
      <input
        v-model.trim="communityJoinKeyword"
        class="mobile-field"
        inputmode="numeric"
        placeholder="输入群 ID"
        required
      />
      <button class="compact-button" type="submit" :disabled="communityJoining">
        {{ communityJoining ? '提交中' : '申请加入' }}
      </button>
    </form>
  </section>

  <div v-if="communityLoading" class="empty-mobile">
    <div><strong>正在加载群聊</strong></div>
  </div>
  <div v-else-if="communities.length" class="mobile-list">
    <article
      v-for="(community, index) in communities"
      :key="communityId(community)"
      class="community-mobile-item"
    >
      <span class="mobile-avatar" :class="{ warm: index % 2 === 1 }">
        <img
          v-if="communityImg(community)"
          :src="assetUrl(communityImg(community))"
          :alt="communityName(community)"
        />
        <template v-else>群</template>
      </span>
      <div class="community-mobile-copy">
        <h3>{{ communityName(community) || '未命名群聊' }}</h3>
        <p>{{ communityDesc(community) || '这个群聊还没有简介' }}</p>
        <div class="community-meta-line">
          <span>ID {{ communityId(community) }}</span>
          <span class="status-chip">
            {{ communityIsOwner(community) ? '我创建的' : '已加入' }}
          </span>
        </div>
        <div class="invite-line">
          <button
            class="compact-button primary"
            type="button"
            @click.stop="selectCommunity(community)"
          >
            进入群聊
          </button>
          <select v-model="communityInviteTarget" class="mobile-field">
            <option value="">邀请好友</option>
            <option
              v-for="person in friends"
              :key="userId(person)"
              :value="userId(person)"
            >
              {{ personName(person) }}
            </option>
          </select>
          <button
            class="compact-button"
            type="button"
            :disabled="!communityInviteTarget"
            @click="inviteCommunity(community)"
          >
            邀请
          </button>
        </div>
      </div>
    </article>
  </div>
  <div v-else class="empty-mobile">
    <div>
      <span class="empty-mobile-icon"><i data-lucide="users-round"></i></span>
      <strong>还没有群聊</strong>
      <span>创建群聊，或通过群 ID 申请加入</span>
    </div>
  </div>
</div>
